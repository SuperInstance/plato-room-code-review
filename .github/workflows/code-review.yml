# The fleet's own CI-bypass detector, run on every pull request.
#
# SuperInstance/plato-room-code-review ships the check that names this class of defect
# correctly (`ci_bypass`: `|| true`, `continue-on-error: true`, `set +e`) at
# reviewer.py:145-150. Until now it was wired into exactly one repository, and even there
# the workflow could not run -- it referenced a composite action that does not exist.
#
# The detector has no third-party dependencies, so it is checked out and run from source.
# (It is not on PyPI, so the `pip install plato-room-code-review` form in its README cannot
# work either.)
name: PLATO Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the detector
        uses: actions/checkout@v4
        with:
          repository: SuperInstance/plato-room-code-review
          ref: main
          path: .plato-detector

      - name: Run the detector
        working-directory: .plato-detector
        run: |
          python -m plato_room_code_review.room \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
